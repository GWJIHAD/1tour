<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Console</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{background:#0f172a;color:#e2e8f0;font-family:Inter,system-ui}.glass{background:#111c31;border:1px solid #334155;border-radius:16px}input,select{background:#0b1220;border:1px solid #334155;border-radius:9px;padding:10px;width:100%;color:#e2e8f0}.btn{background:#f97316;color:white;border-radius:10px;padding:10px 14px;font-weight:700}.muted{color:#94a3b8}</style>
</head>
<body>
<header class="border-b border-slate-700 p-4 flex justify-between items-center"><h1 class="text-xl font-black">Admin Panel</h1><button id="login" class="btn">Admin Sign In</button></header>
<main class="max-w-4xl mx-auto p-4" id="mainContent">
<div class="glass p-6"><p class="muted">Please sign in with jahidulhasanjihad@gmail.com to create matches.</p></div>
</main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,collection,addDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyDya0Jd6XkK0db6tDMU-V7xM7dy5gKBk4k",
  authDomain: "ai-turnament-app.firebaseapp.com",
  databaseURL: "https://ai-turnament-app-default-rtdb.firebaseio.com",
  projectId: "ai-turnament-app",
  storageBucket: "ai-turnament-app.firebasestorage.app",
  messagingSenderId: "478532172993",
  appId: "1:478532172993:web:8655f93e5df5d2e8dd6840",
  measurementId: "G-QBFNQEB0GV"
};

const ADMIN_EMAIL = 'jahidulhasanjihad@gmail.com';
const $=id=>document.getElementById(id);
let app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app), user=null;

onAuthStateChanged(auth,u=>{
  user=u;
  if(u){
    if(u.email!==ADMIN_EMAIL){alert('Access Denied!');signOut(auth);return;}
    $('login').textContent='Sign Out';
    $('mainContent').innerHTML=`<div class="glass p-6"><h2 class="text-xl font-bold mb-4">Create Tournament</h2><form id="matchForm" class="space-y-3"><input name="title" required placeholder="Match Title"><select name="mode"><option>Solo</option><option>Duo</option><option>Squad</option></select><input name="entryFee" type="number" required value="20" placeholder="Entry Fee"><input name="prizePool" type="number" required value="1000" placeholder="Prize Pool"><button class="btn w-full">Create Match</button></form></div>`;
    $('matchForm').onsubmit=async e=>{
      e.preventDefault();
      const f=new FormData(e.target);
      try{
        await addDoc(collection(db,'matches'),{
          title:f.get('title'), mode:f.get('mode'), entryFee:Number(f.get('entryFee')),
          prizePool:Number(f.get('prizePool')), createdAt:serverTimestamp()
        });
        alert('Match Created Successfully!');
      }catch(err){alert(err.message)}
    };
  }else{
    $('login').textContent='Admin Sign In';
    $('mainContent').innerHTML=`<div class="glass p-6"><p class="muted">Sign in with admin email to continue.</p></div>`;
  }
});

$('login').onclick=async()=>{if(user)return signOut(auth);try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){alert(e.message)}};
</script>
</body>
</html>
